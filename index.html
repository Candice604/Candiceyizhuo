          return;
        }

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'prototype-hotspot';
        button.setAttribute('aria-label', hotspot.name || 'Prototype interaction');
        applyRect(button, hotspot.rect);
        const eventNames = {
          ON_CLICK: 'click',
          ON_PRESS: 'pointerdown',
          ON_DRAG: 'pointerup',
          MOUSE_DOWN: 'pointerdown',
          MOUSE_UP: 'pointerup',
          ON_HOVER: 'mouseenter',
          MOUSE_ENTER: 'mouseenter',
          MOUSE_LEAVE: 'mouseleave',
        };
        const eventName = eventNames[trigger.type] || 'click';
        button.addEventListener(eventName, () => executeActions(hotspot));
        stage.appendChild(button);
      }

      function syncPageSong(frame) {
        const shouldPlay = !!frame && frame.id === songFrameId;
        if (!shouldPlay) {
          pageSong.pause();
          if (pageSong.currentTime) pageSong.currentTime = 0;
          return;
        }
        if (!pageSong.paused) return;
        pageSong.currentTime = 0;
        const playback = pageSong.play();
        if (playback && typeof playback.catch === 'function') playback.catch(() => {});
      }

      function render(frame) {
        clearTimers();
        stage.className = 'prototype-stage';
        stage.replaceChildren(frameImage(frame));
        fitStage(frame);
        frame.hotspots.forEach((hotspot) => bindHotspot(frame, hotspot));
        addFallbackZones(frame);
        currentId = frame.id;
        syncPageSong(frame);
        document.title = `${frame.name} — ${site.title}`;
        announcement.textContent = frame.name;
        const index = site.frames.findIndex((item) => item.id === frame.id);
        preloadFrame(site.frames[index - 1]);
        preloadFrame(site.frames[index + 1]);
        frame.hotspots.forEach((hotspot) => hotspot.actions.forEach((action) => {
          if (action.type === 'NODE') preloadFrame(frameMap.get(action.destinationId));
        }));
      }

      function finishAnimation(target, delay) {
        timers.push(setTimeout(() => {
          busy = false;
          render(target);
        }, delay));
      }

      function navigationTransition(source, target, requested) {
        if (source.name === 'HP' && /\scover$/i.test(target.name)) {
          return { type: 'PUSH', duration: .42, easing: { type: 'EASE_OUT' }, direction: 'LEFT' };
        }
        if (target.name === 'HP' && source.name !== 'HP') {
          return { type: 'PUSH', duration: .42, easing: { type: 'EASE_OUT' }, direction: 'RIGHT' };
        }
        return requested;
      }

      function animateFade(source, target, transition) {
        clearTimers();
        const duration = durationMs(transition);
        stage.style.setProperty('--duration', `${duration}ms`);
        stage.style.setProperty('--easing', easingCss(transition && transition.easing));
        const oldImage = frameImage(source, 'screen-image transition-old transition-fade-out');
        const newImage = frameImage(target, 'screen-image transition-new transition-fade-in');
        stage.replaceChildren(newImage, oldImage);
        finishAnimation(target, duration + 40);
      }

      function directionalVector(direction) {
        const vectors = {
          LEFT: ['100%', '0%'],
          RIGHT: ['-100%', '0%'],
          TOP: ['0%', '100%'],
          BOTTOM: ['0%', '-100%'],
        };
        return vectors[direction] || vectors.LEFT;
      }

      function animateDirectional(source, target, transition) {
        clearTimers();
        const duration = durationMs(transition);
        const vector = directionalVector(transition.direction);
        stage.style.setProperty('--duration', `${duration}ms`);
        stage.style.setProperty('--easing', easingCss(transition.easing));
        stage.style.setProperty('--enter-x', vector[0]);
        stage.style.setProperty('--enter-y', vector[1]);
        stage.style.setProperty('--exit-x', `calc(${vector[0]} * -1)`);
        stage.style.setProperty('--exit-y', `calc(${vector[1]} * -1)`);
        const oldImage = frameImage(source, 'screen-image transition-old transition-slide-out');
        const newImage = frameImage(target, 'screen-image transition-new transition-slide-in');
        stage.replaceChildren(newImage, oldImage);
        finishAnimation(target, duration + 40);
      }

      function animateBook(source, target, transition) {
        clearTimers();
        const sourceIndex = source.order;
        const targetIndex = target.order;
        const forward = targetIndex >= sourceIndex;
        const duration = Math.max(520, durationMs(transition));
        const sourceRegions = source.bookRegions || {};
        const targetRegions = target.bookRegions || {};
        const movingRect = forward
          ? sourceRegions.right || targetRegions.right || defaultPageRect('right')
          : sourceRegions.left || targetRegions.left || defaultPageRect('left');
        const backRect = forward
          ? targetRegions.left || sourceRegions.left || defaultPageRect('left')
          : targetRegions.right || sourceRegions.right || defaultPageRect('right');
        const sourceIsCover = !sourceRegions.left && !!sourceRegions.right;
        const holdRect = forward
          ? sourceRegions.left || targetRegions.left
          : sourceRegions.right || targetRegions.right;

        stage.style.setProperty('--duration', `${duration}ms`);
        stage.style.setProperty('--easing', easingCss(transition && transition.easing));
        stage.replaceChildren(frameImage(target, 'screen-image transition-new'));
        stage.classList.add('is-page-turning');

        if (holdRect) {
          const hold = document.createElement('div');
          hold.className = 'book-hold';
          applyRect(hold, holdRect);
          if (forward && sourceIsCover) {
            hold.classList.add('book-hold--paper');
            hold.style.setProperty('--paper-color', /^02\s/.test(target.name) ? '#6397ec' : '#fff');
          } else {
            const holdImage = frameImage(source, 'book-crop-image');
            applyCrop(holdImage, source, holdRect);
            hold.appendChild(holdImage);
          }
          stage.appendChild(hold);
        }

        const sheet = document.createElement('div');
        sheet.className = `book-sheet ${forward ? 'book-sheet--forward' : 'book-sheet--backward'}`;
        applyRect(sheet, movingRect);

        const front = document.createElement('div');
        front.className = 'book-face book-face--front';
        const frontImage = frameImage(source, 'book-crop-image');
        applyCrop(frontImage, source, movingRect);
        front.appendChild(frontImage);

        const back = document.createElement('div');
        back.className = 'book-face book-face--back';
        const backImage = frameImage(target, 'book-crop-image');
        applyCrop(backImage, target, backRect);
        back.appendChild(backImage);

        const gloss = document.createElement('span');
        gloss.className = 'book-gloss';
        sheet.append(front, back, gloss);
        stage.appendChild(sheet);
        finishAnimation(target, duration + 20);
      }

      async function navigate(destinationId, action, pushHistory = true) {
        if (busy || !frameMap.has(destinationId) || destinationId === currentId) return;
        const source = frameMap.get(currentId);
        const target = frameMap.get(destinationId);
        const transition = navigationTransition(source, target, action && action.transition);
        syncPageSong(target);
        busy = true;
        await preloadFrame(target);
        if (pushHistory && (!action || action.navigation !== 'SWAP')) history.push(currentId);

        if (!transition) {
          busy = false;
          render(target);
          return;
        }
        if (transition.type === 'SMART_ANIMATE') {
          if (site.fallback === 'book') animateBook(source, target, transition);
          else animateFade(source, target, transition);
          return;
        }
        if (['MOVE_IN', 'MOVE_OUT', 'PUSH', 'SLIDE_IN', 'SLIDE_OUT'].includes(transition.type)) {
          animateDirectional(source, target, transition);
          return;
        }
        animateFade(source, target, transition);
      }

      document.addEventListener('keydown', (event) => {
        if (busy) return;
        const keyCode = event.keyCode || event.which;
        const match = keyHotspots.find((hotspot) => (hotspot.trigger.keyCodes || []).includes(keyCode));
        if (match) {
          event.preventDefault();
          executeActions(match);
          return;
        }
        if (!site.sequentialFallback) return;
        const currentIndex = site.frames.findIndex((frame) => frame.id === currentId);
        if (event.key === 'ArrowRight' && site.frames[currentIndex + 1]) navigate(site.frames[currentIndex + 1].id, { transition: { type: 'SMART_ANIMATE', duration: .8, easing: { type: 'EASE_IN_AND_OUT' } } });
        if (event.key === 'ArrowLeft' && site.frames[currentIndex - 1]) navigate(site.frames[currentIndex - 1].id, { transition: { type: 'SMART_ANIMATE', duration: .8, easing: { type: 'EASE_IN_AND_OUT' } } });
      });

      window.addEventListener('resize', () => fitStage(frameMap.get(currentId)));
      render(frameMap.get(currentId));
    })();</script>
</body>
</html>
